<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" aria-labelledby="title desc">
  <title id="title">Arpillera Chilean inspirada en el paisaje del sur</title>
  <desc id="desc">Tapiz artesanal con flores, montañas, casas y geometrías coloridas.</desc>
  <defs>
    <filter id="cloth" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="8" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="soft-light"/>
    </filter>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 2h14M0 7h14M2 0v14M7 0v14" stroke="#fff" stroke-width="1" opacity=".08"/>
      <path d="M0 4.5h14M4.5 0v14" stroke="#533425" stroke-width=".7" opacity=".08"/>
    </pattern>
    <pattern id="border" width="38" height="38" patternUnits="userSpaceOnUse">
