      <circle cx="17" cy="0" r="11" fill="#f3c95f"/>
      <circle cx="0" cy="17" r="11" fill="#f3c95f"/>
      <circle cx="-17" cy="0" r="11" fill="#f3c95f"/>
      <circle r="8" fill="#c94f45"/>
